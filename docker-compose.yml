services:
  mariadb:
    image: mariadb:10.11
    container_name: smartgarden-mariadb
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_secret_password_smartgarden
      MYSQL_DATABASE: smartgarden
      MYSQL_USER: smartgarden_user
      MYSQL_PASSWORD: smartgarden_pass
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data:
    driver: local
