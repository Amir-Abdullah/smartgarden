name: SmartGarden CI

on:
  push:
    branches: [main, sprint2, sprint3, sprint4, sprint5]
  pull_request:
    branches: [main]

jobs:
  backend-and-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore vendored backend dependencies & verify parity
        run: |
          node -e "
            const fs = require('fs'), path = require('path');
            function copyDir(s, d) {
              fs.mkdirSync(d, { recursive: true });
              for (const e of fs.readdirSync(s, { withFileTypes: true })) {
                const sp = path.join(s, e.name), dp = path.join(d, e.name);
                if (e.isDirectory()) copyDir(sp, dp); else fs.copyFileSync(sp, dp);
              }
            }
            copyDir('backend/vendor', 'node_modules');
          "
          npm --prefix backend install sqlite3 bcryptjs dotenv

      - name: Run Backend Tests (F1-F24)
        env:
          DB_DIALECT: sqlite
          DB_STORAGE: ':memory:'
        run: npm test

      - name: Verify Migration & Demo Seed Idempotency
        env:
          DB_DIALECT: sqlite
          DB_STORAGE: /tmp/ci_idempotency.sqlite
        run: |
          node backend/scripts/migrate.js
          node backend/scripts/seed-demo.js
          node backend/scripts/seed-demo.js

      - name: Install Frontend Dependencies & Build Production Bundle
        run: |
          npm --prefix frontend install
          npm --prefix frontend run build
